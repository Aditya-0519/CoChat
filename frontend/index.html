<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/icon-32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/icons/icon-64.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/icon-180.png"
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- Browser / PWA theme -->
    <meta
      name="theme-color"
      content="#6366f1"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="CoChat"
    />

    <!-- Mobile viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="CoChat — meet people worth talking to."
    />

    <title>
      CoChat — Meet people worth talking to
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
